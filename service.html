<!DOCTYPE html>
<!--lang est un attribut qui vas désigner la langue-->
<html lang="fr">

<!--l'entête de la page -->
<head> 

<!--charset est un attribut qui permet d'ajouter des accents, appostrophes...-->    
    <meta charset="utf-8">

    <title> Service.HTML </title>

    <!--J'importe mon fichier service.css-->
    <link href="service.css" rel="stylesheet">
    <!--L'attribut rel indique le type de lien et href précise la source du fichier a impoter -->

<style>
  .flower {
    width: 150px;
    height: 150px;
    position: relative;
    margin: 40px auto;
  }

  .petal {
    width: 60px;
    height: 90px;
    background: #ff7eb9;
    border-radius: 50px 50px 50px 50px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center bottom;
  }

  /* Pétale du haut */
  .p1 {
    transform: translate(-50%, -100%);
  }

  /* Pétale de droite */
  .p2 {
    transform: translate(0%, -50%) rotate(90deg);
  }

  /* Pétale du bas */
  .p3 {
    transform: translate(-50%, 0%) rotate(180deg);
  }

  /* Pétale de gauche */
  .p4 {
    transform: translate(-100%, -50%) rotate(-90deg);
  }

  /* Centre de la fleur */
  .center {
    width: 50px;
    height: 50px;
    background: #ffd166;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
</style>
</head>

<!--le corps de la page -->
<body> 
     <div class="flower">
  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="center"></div>
</div>

    <!--elle permet de créer une sections --> <!--peut mettre un id  exempl: "div1"-->

    <div id="divsolid">    
        <p> J'apprends le langage HTML. J'utilise le CSS pour mettre en forme ma page WEB.</p>
    </div id="divsolid">  
    <br>
    <div id="divdouble">
        <p> Je maquille ma page web</p>
    </div id="divdouble">
    <br>
    <div id="divdotted">
        <p> Pour avoir un magnifique aspect </p>
    </div id="divdotted">
    <br>
    <div id="divdashed">
        <p>Pour attirer mes seuffeure </p>
    </div id="divdashed">
        
<br>

    <div id="div1">
      <p> Je teste Code PEN. </p>
    </div>
    
    <br>
    
    <div id="div2">
         <p>Mon deuxième paragraphe.</p> 
    </div>
    

    <br>

   
    

</body>


</html>
